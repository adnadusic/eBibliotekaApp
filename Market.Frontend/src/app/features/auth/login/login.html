<section class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Prijava</h1>
    <p>Prijavite se za dodavanje, izmjenu i brisanje knjiga.</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Unesite ispravan email.</small>
    }

    <label for="password">Lozinka</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Lozinka je obavezna.</small>
    }

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Prijava...' : 'Prijavi se' }}
    </button>
  </form>
</section>
