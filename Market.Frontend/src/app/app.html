<header class="app-header">
  <a class="brand" routerLink="/">
    eBiblioteka
  </a>

  <nav>
    @if (authService.isLoggedIn()) {
      <a routerLink="/dashboard">
        Dashboard
      </a>

      <a routerLink="/settings">
        Settings
      </a>

      <a routerLink="/notifications">
        Notifications
      </a>

      <a routerLink="/audit-trail">
        Audit Trail
      </a>

      <a routerLink="/reports">
        PDF Reports
      </a>

      <button
        type="button"
        (click)="logout()"
      >
        Logout
      </button>
    } @else {
      <a routerLink="/login">
        Login
      </a>
    }
  </nav>
</header>

<router-outlet />
