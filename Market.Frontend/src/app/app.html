<header class="app-header">
  <a class="brand" routerLink="/">
    eBiblioteka
  </a>

  <nav>
    @if (authService.isLoggedIn()) {
      <a routerLink="/notifications">
        Notifikacije
      </a>

      <a routerLink="/audit-trail">
        Audit Trail
      </a>

      <a routerLink="/reports">
        PDF izvještaji
      </a>

      <button
        type="button"
        (click)="logout()"
      >
        Odjava
      </button>
    } @else {
      <a routerLink="/login">
        Prijava
      </a>
    }
  </nav>
</header>

<router-outlet />
